set-option -g prefix C-a
bind C-a send-prefix

#petrol blue
# todo: does tmux support setting color variables?

set -g @primary '#216477'
set -g @secondary '#1c1c1c'
set -g @secondary2 '#626262'
set -g @secondary3 '#bcbcbc'

set -g @bg_prefix '#216477'
set -g @fg_prefix '#ffffff'

# default
set -g status-bg '#1c1c1c' # gray
set -g status-fg '#216477' # blue petrol

set -g status-left ''
set -g status-right '#{?client_prefix,#[fg=#ffffff#,bg=#216477],#[fg=#1c1c1c#,bg=#626262]} #{client_session} %Y/%m/%dT%H:%M '
set -g message-style "fg=#ffffff,bg=#{@secondary}"
set -g mode-style "fg=#ffffff,bg=#216477"
set -g pane-border-style 'fg=#{@secondary}'
set -g pane-active-border-style 'fg=#{@secondary2}'
#set -g popup-style "fg=#ffffff,bg=#{@secondary}"
set -g popup-style "fg=yellow,bg=blue"
set -g popup-border-style "fg=green,bg=magenta"
set -g message-command-style "fg=#{@secondary3},bg=#{@secondary}"

set -g display-panes-colour "white"
set -g display-panes-active-colour "#216477"

set -g clock-mode-colour "#216477"

# little menu
#set -g menu-style fg=green,bg=magenta
set -g menu-selected-style "fg=#ffffff,bg=#{@primary}"
set -g menu-border-style "fg=#{@secondary}"


set -g base-index 1
set -g renumber-windows on

setw -g window-status-format '#[fg=#{@secondary3}]#I:#W#F'
setw -g window-status-current-format '#[fg=#ffffff]#I:#W#F'


set -g default-terminal "tmux-256color"

set -g mode-keys vi
set -g status-keys vi
set-window-option -g mode-keys vi

unbind -T copy-mode-vi C-j
bind-key -T copy-mode-vi Enter send -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi y send -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi C-c send-keys -X cancel

bind-key C-u run-shell -b "tmux capture-pane -J -p | grep -oE '(https?):\/\/.*[^>]' | fzf-tmux -d20 --multi --bind alt-a:select-all,alt-d:deselect-all | xargs open"


is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind C-l send-keys 'C-l'
bind c new-window -c "#{pane_current_path}"
# Session list shortcuts: 0-9, then capitals instead of M-a.. (Option isn't Meta here).
# Skips H M N O T X, which the list already uses.
bind s choose-tree -Zs -K "#{?#{e|<:#{line},10},#{line},#{?#{==:#{line},10},A,#{?#{==:#{line},11},B,#{?#{==:#{line},12},C,#{?#{==:#{line},13},D,#{?#{==:#{line},14},E,#{?#{==:#{line},15},F,#{?#{==:#{line},16},G,#{?#{==:#{line},17},I,#{?#{==:#{line},18},J,#{?#{==:#{line},19},K,#{?#{==:#{line},20},L,#{?#{==:#{line},21},P,#{?#{==:#{line},22},Q,#{?#{==:#{line},23},R,#{?#{==:#{line},24},S,#{?#{==:#{line},25},U,#{?#{==:#{line},26},V,#{?#{==:#{line},27},W,#{?#{==:#{line},28},Y,#{?#{==:#{line},29},Z,}}}}}}}}}}}}}}}}}}}}}"


set -g mouse on
unbind r
bind r source-file ~/.tmux.conf
set -sg escape-time 10 # https://superuser.com/a/1809494/1156747
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set-option -g focus-events on
set -as terminal-features ',gnome*:RGB'

set -g @continuum-save-interval '1'

run '~/.tmux/plugins/tpm/tpm'

set -g history-limit 30000
set -g extended-keys on
set -g extended-keys-format csi-u

# Copy a mouse selection on release and stay in copy mode. A release outside the
# pane leaves tmux's edge-scroll timer running while the cursor is on the top or
# bottom line, so step the cursor one line inward to stop it.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe pbcopy \; send -X clear-selection \; if -F '#{==:#{copy_cursor_y},0}' 'send -X cursor-down' \; if -F '#{==:#{copy_cursor_y},#{e|-:#{pane_height},1}}' 'send -X cursor-up'

# Scrolling with the wheel marks the pane, so typing leaves copy mode and goes to the prompt (bin/tmux-type-to-leave-scroll).
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { set -p @scrolled 1 ; copy-mode -e }
bind-key [ set -p @scrolled 0 \; copy-mode
run-shell '~/dotfiles/bin/tmux-type-to-leave-scroll'
